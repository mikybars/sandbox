logging:
  level:
    root: WARN
    com.inditex.rrhh.icmclcwb: INFO
amiga:
  monitoring:
    metrics:
      enabled: true
      send: true
      functional:
        aspect:
          timer:
            enabled: true
          counter:
            enabled: true
  common:
    rest:
      client:
        http:
          connect-timeout: 300000
          read-timeout: 300000
        auth:
          method: BASIC
        ptr-venta:
          auth-method: BASIC
        ptr-presencia:
          auth-method: BASIC
    resilience:
      backends:
        trabajo:
          waitDurationInOpenState: PT60S
          failureRateThreshold: 50
          permittedNumberOfCallsInHalfOpenState: 10
          slidingWindowSize: 100
          slidingWindowType: COUNT_BASED
        tarea:
          waitDurationInOpenState: PT60S
          failureRateThreshold: 50
          permittedNumberOfCallsInHalfOpenState: 10
          slidingWindowSize: 100
          slidingWindowType: COUNT_BASED
        limpieza:
          waitDurationInOpenState: PT60S
          failureRateThreshold: 50
          permittedNumberOfCallsInHalfOpenState: 10
          slidingWindowSize: 100
          slidingWindowType: COUNT_BASED
        programacion:
          waitDurationInOpenState: PT60S
          failureRateThreshold: 50
          permittedNumberOfCallsInHalfOpenState: 10
          slidingWindowSize: 100
          slidingWindowType: COUNT_BASED          
  service:
    jms:
      listener:
        default:
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
      trabajo-queue:
        destination-fqdn: ${metadata.tenant}.${metadata.domain}.${metadata.openshiftproject}.private.trabajo-queue-${metadata.slot}
      tarea-queue:
        destination-fqdn: ${metadata.tenant}.${metadata.domain}.${metadata.openshiftproject}.private.tarea-queue-${metadata.slot}
      limpieza-queue:
        destination-fqdn: ${metadata.tenant}.${metadata.domain}.${metadata.openshiftproject}.private.limpieza-queue-${metadata.slot}
      programacion-queue:
        destination-fqdn: ${metadata.tenant}.${metadata.domain}.${metadata.openshiftproject}.private.programacion-queue-${metadata.slot}
  data:
    jms:
      connection-factory:
        broker-escritura:
          minPoolSize: 10
          maxPoolSize: 20
          xaConnectionFactory:
            #brokerURL: tcp://middleware-amq-tcp:61616
            brokerURL: failover:(tcp://middleware-amq-tcp:61616)
            userName: usr-write
        broker-lectura:
          minPoolSize: 10
          maxPoolSize: 20
          xaConnectionFactory:
            #brokerURL: tcp://middleware-amq-tcp:61616
            brokerURL: failover:(tcp://middleware-amq-tcp:61616)
            userName: usr-read
      listener-container-factory:
        trabajo:
          concurrency: 1
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
        tarea:
          concurrency: 10
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
        limpieza:
          concurrency: 1
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
        programacion:
          concurrency: 1
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
      client:
        trabajo:
          destinationName: ${amiga.service.jms.trabajo-queue.destination-fqdn}
          pubSubDomain: false
          sessionTransacted: true
        tarea:
          destinationName: ${amiga.service.jms.tarea-queue.destination-fqdn}
          pubSubDomain: false
          sessionTransacted: true
        limpieza:
          destinationName: ${amiga.service.jms.limpieza-queue.destination-fqdn}
          pubSubDomain: false
          sessionTransacted: true
        programacion:
          destinationName: ${amiga.service.jms.programacion-queue.destination-fqdn}
          pubSubDomain: false
          sessionTransacted: true          
    jdbc:
      configuration:
        prop:
          default-isolation-level: 1
          max-pool-size: 10
          query-timeout: 90s
          borrow-connection-timeout: 600
      datasource:
        primary:
          #init-connection-sql: set schema GESTION_COMISION
          xa-data-source-class-name: com.ibm.db2.jcc.DB2XADataSource
          xa-properties:
            clientProgramName: ${metadata.jirakey}
            driverType: 4
            loginTimeout: 300
            connectionTimeout: 300
            commandTimeout: 300
            interruptProcessingMode: 2
    jpa:
      properties:
        hibernate.dialect: com.inditex.rrhh.icmclcwb.model.primary.dialect.DB2NativeDialect
        hibernate.default_schema: GESTION_COMISION
app:
  envars:
    calculo:
      cast: true
      precision: 'DECIMAL(23,8)'
    proceso: 
