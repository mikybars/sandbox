logging:
  level:
    root: WARN
    com.inditex.rrhh.icmclcwb: INFO
amiga:
  monitoring:
    metrics:
      enabled: true
      send: true
  common:
    rest:
      client:
        http:
          connect-timeout: 300000
          ead-timeout: 300000
        auth:
          method: BASIC
        ptr-venta:
          auth-method: BASIC
        ptr-presencia:
          auth-method: BASIC
  service:
    jms:
      listener:
        default:
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
      trabajo-queue:
        destination-fqdn: ${metadata.tenant}.${metadata.domain}.${metadata.openshiftproject}.private.trabajo-queue-${metadata.slot}
      tarea-queue:
        destination-fqdn: ${metadata.tenant}.${metadata.domain}.${metadata.openshiftproject}.private.tarea-queue-${metadata.slot}
  data:
    jms:
      connection-factory:
        broker-escritura:
          minPoolSize: 1
          maxPoolSize: 10
          xaConnectionFactory:
            brokerURL: tcp://middleware-amq-tcp:61616
            userName: usr-write
        broker-lectura:
          minPoolSize: 1
          maxPoolSize: 10
          xaConnectionFactory:
            brokerURL: tcp://middleware-amq-tcp:61616
            userName: usr-read
      listener-container-factory:
        trabajo:
          concurrency: 1
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
        tarea:
          concurrency: 2
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
      client:
        trabajo:
          destinationName: ${amiga.service.jms.trabajo-queue.destination-fqdn}
          pubSubDomain: false
          sessionTransacted: true
        tarea:
          destinationName: ${amiga.service.jms.tarea-queue.destination-fqdn}
          pubSubDomain: false
          sessionTransacted: true
    jdbc:
      configuration:
        prop:
          default-isolation-level: 1
          max-pool-size: 10
          query-timeout: 60s
      datasource:
        primary:
          xa-data-source-class-name: com.ibm.db2.jcc.DB2XADataSource
          xa-properties:
            clientProgramName: ${metadata.jirakey}
            driverType: 4
            loginTimeout: 300
            connectionTimeout: 300
            commandTimeout: 300
            interruptProcessingMode: 2
    hibernate:
      primary:
        properties: '{''hibernate.dialect'':''com.inditex.rrhh.icmclcwb.model.primary.dialect.DB2NativeDialect''}'
app:
  envars:
    calculo:
      cast: true
      precision: 'DECIMAL(23,8)'
    proceso: 
      cast: true
      precision: 'DECIMAL(23,8)'
    tarea:
      recolectar:
        days-number: 3
      validar:
        enabled: true
        logging: true
        exception: false
      calcular:
        algoritmo:
          config:
            batch-size: 25
    repository:
      batch-size:
        default: 100
    ptr:
      config:
        max-attempts: 2
      venta:
