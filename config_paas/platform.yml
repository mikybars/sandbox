app:
  context_path_builder:
    enabled: true
  health_probe:
    initial_delay_seconds: 80
  has_spnego: true
  services:
    http:
      route:
        tls:
          enabled: true
          insecure_termination_policy: Redirect
    http_private:
      enabled: true
datagrid:
  force: false
  application_cache:
    enabled: true
  session:
    enabled: true
amq:
  enabled: true