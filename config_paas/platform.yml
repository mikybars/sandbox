app:
  context_path: /
  health_probe:
    initial_delay_seconds: 80
  has_spnego: true
  services:
    http:
      route:
        tls:
          enabled: true
          insecure_termination_policy: Redirect
        timeout: 600
datagrid:
  application_cache:
    enabled: true
  session:
    enabled: true
amq:
  enabled: true