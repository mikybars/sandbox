app:
  limits:
    cpu: 2
    memory: 4096Mi
  context_path_builder:
    enabled: true
  health_probe:
    initial_delay_seconds: 120
  readiness_probe:
    initial_delay_seconds: 120
  has_spnego: true
  services:
    http:
      route:
        tls:
          enabled: true
          insecure_termination_policy: Redirect
    http_private:
      enabled: true
datagrid:
  force: false
  application_cache:
    enabled: true
  session:
    enabled: true
amq:
  force: false
  enabled: true
  scheduler:
    enabled: true
