metadata:
  domain: rhcompensa
  service: income
  tenant: global
  developModel: CORPORATE
  layer: core
app:
  context_path_builder:
    enabled: true
  readiness_probe:
    initial_delay_seconds: 120
  liveness_probe:
    initial_delay_seconds: 150
  instrumented:
    readiness_probe:
      initial_delay_seconds: 180
    liveness_probe:
      initial_delay_seconds: 210
  has_spnego: true
  services:
    http:
      route:
        tls:
          enabled: true
          insecure_termination_policy: Redirect
    http_private:
      enabled: true
  replicas: 1
  scaler:
    optin: true
datagrid:
  force: false
  application_cache:
    enabled: true
  session:
    enabled: true
amq:
  force: false
  enabled: true
  scheduler:
    enabled: true
