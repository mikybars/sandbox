logging:
  level:
    root: WARN
    com.inditex.rrhh.icmclcwb: INFO
amiga:
  monitoring:
    metrics:
      enabled: true
      send: true
  common:
    rest:
      client:
        defaultConnectTimeout: 1000
        defaultReadTimeout: 1000
        ptrVentaClient:
          base-url: http://axpreptrapp01-vip.central.inditex.grp:10813/OFDAVTIMPADWSD/service
        ptrPresenciaClient:
          base-url: http://axpreptrapp01-vip.central.inditex.grp:10813/OFDARHPRSCAWSD/service
  service:
    jms:
      trabajo-queue:
        destination-fqdn: ${metadata.tenant}.${metadata.domain}.${metadata.openshiftproject}.private.trabajo-queue-${metadata.slot}
        concurrency: 10-20
  data:
    jdbc:
      configuration:
        prop:
          default-isolation-level: 1
          max-pool-size: 20
      datasource:
        primary:
          driverClassName: org.h2.Driver
          url: jdbc:h2:mem:INDITEX;MODE=DB2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS DESARROLLO_RRHH
          user: sa
          password: sa
        secondary:
          driverClassName: org.h2.Driver
          url: jdbc:h2:mem:PeopleNet;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          user: sa
          password: sa
    hibernate:
      primary:
        properties: '{''hibernate.enable_lazy_load_no_trans'':''true'',''hibernate.dialect'':''org.hibernate.dialect.H2Dialect'',''hibernate.hbm2ddl.auto'':''create'',''hibernate.connection.CharSet'':''utf8'',''hibernate.connection.characterEncoding'':''utf8'',''hibernate.connection.useUnicode'':''true'',''hibernate.hbm2ddl.import_files'':''import-primary-dml.sql'',''hibernate.show_sql'':''false'',''hibernate.format_sql'':''true'',''hibernate.jdbc.batch_size'':''1000'',''hibernate.order_inserts'':''true'',''hibernate.order_updates'':''true'',''hibernate.jdbc.batch_versioned_data'':''true'',''hibernate.generate_statistics'':''true''}'
      secondary:
        properties: '{''hibernate.enable_lazy_load_no_trans'':''true'',''hibernate.dialect'':''org.hibernate.dialect.H2Dialect'',''hibernate.hbm2ddl.auto'':''create'',''hibernate.connection.CharSet'':''utf8'',''hibernate.connection.characterEncoding'':''utf8'',''hibernate.connection.useUnicode'':''true'',''hibernate.hbm2ddl.import_files'':''import-secondary-dml.sql'',''hibernate.show_sql'':''false'',''hibernate.format_sql'':''true'',''hibernate.jdbc.batch_size'':''1000'',''hibernate.order_inserts'':''true'',''hibernate.order_updates'':''true'',''hibernate.jdbc.batch_versioned_data'':''true''}'
    jms:
      connectionFactory:
        brokerEscritura:
          brokerURL: tcp://middleware-amq-tcp:61616
          userName: usr-write
        brokerLectura:
          brokerURL: tcp://middleware-amq-tcp:61616
          userName: usr-read
      client:
        trabajoJmsClient:
          destinationName: ${amiga.service.jms.trabajo-queue.destination-fqdn}
          receiveTimeout: 100
          pubSubDomain: false
app:
  envars:
    ptr:
      venta:
        service:
          getVentaTotalizado:
            endpoint: /ventaGeneralService/getVentaTotalizado
            filter:
              maxPageSize: 200
              maxQuerySize: 3
              maxPersistenceSize: 3
              maxBatchSize: 100
              retryAttempts: 2
          getVentaIndividualDetalle:
