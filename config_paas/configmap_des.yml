logging:
  level:
    root: WARN
    com.inditex.rrhh.icmclcwb: INFO
amiga:
  monitoring:
    metrics:
      enabled: true
      send: true
  common:
    rest:
      client:
        defaultConnectTimeout: 300000
        defaultReadTimeout: 300000
        ptr-venta:
          base-url: http://des-openshift.axdesocp1.central.inditex.grp/rhvtimpwsd-develop
          auth-method: BASIC
          username: srvcicmclcwbdes
        ptr-presencia:
          base-url: http://des-openshift.axdesocp1.central.inditex.grp/rhpresnwsd-develop
          auth-method: BASIC
          username: srvcicmclcwbdes
  service:
    jms:
      listener:
        default:
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
      trabajo-queue:
        destination-fqdn: ${metadata.tenant}.${metadata.domain}.${metadata.openshiftproject}.private.trabajo-queue-${metadata.slot}
      tarea-queue:
        destination-fqdn: ${metadata.tenant}.${metadata.domain}.${metadata.openshiftproject}.private.tarea-queue-${metadata.slot}
  data:
    jms:
      connection-factory:
        broker-escritura:
          minPoolSize: 1
          maxPoolSize: 10
          xaConnectionFactory:
            brokerURL: tcp://middleware-amq-tcp:61616
            userName: usr-write
        broker-lectura:
          minPoolSize: 1
          maxPoolSize: 10
          xaConnectionFactory:
            brokerURL: tcp://middleware-amq-tcp:61616
            userName: usr-read
      listener-container-factory:
        trabajo:
          concurrency: 1
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
        tarea:
          concurrency: 1-2
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
      client:
        trabajo:
          destinationName: ${amiga.service.jms.trabajo-queue.destination-fqdn}
          pubSubDomain: false
          sessionTransacted: true
        tarea:
          destinationName: ${amiga.service.jms.tarea-queue.destination-fqdn}
          pubSubDomain: false
          sessionTransacted: true
    jdbc:
      configuration:
        prop:
          default-isolation-level: 1
          max-pool-size: 10
          query-timeout: 30s
      datasource:
        primary:
          xa-data-source-class-name: com.ibm.db2.jcc.DB2XADataSource
          xa-properties:
            serverName: axdesdb22.central.inditex.grp
            portNumber: 50000
            databaseName: INDITEX
            currentSchema: DESARROLLO_RRHH
            #user: uincome
            user: oincome
            clientProgramName: ${metadata.jirakey}
            driverType: 4
            loginTimeout: 10
            connectionTimeout: 10
            commandTimeout: 5
            interruptProcessingMode: 2
    hibernate:
      primary:
        properties: '{''hibernate.dialect'':''com.inditex.rrhh.icmclcwb.model.primary.dialect.DB2NativeDialect''}'
