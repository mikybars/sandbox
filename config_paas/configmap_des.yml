      configuration:
        prop:
          default-isolation-level: 1
          max-pool-size: 10
          query-timeout: 30s
      datasource:
        primary:
          driverClassName: com.ibm.db2.jcc.DB2Driver
          url: jdbc:db2://axdesdb22.central.inditex.grp:50000/INDITEX:currentSchema=DESARROLLO_RRHH;
          #user: uincome
          user: oincome
          password: aMJLp8ahF09w
          min-pool-size: 5
          max-pool-size: 10
          driver-properties:
            clientProgramName: ${metadata.jirakey}
            loginTimeout: 10
            connectionTimeout: 10
            commandTimeout: 5
    hibernate:
      primary:
        properties: '{''hibernate.dialect'':''com.inditex.rrhh.icmclcwb.model.primary.dialect.DB2NativeDialect'',''hibernate.connection.isolation'':''1''}'
    jms:
      connection-factory:
        broker-escritura:
          brokerURL: tcp://middleware-amq-tcp:61616
          userName: usr-write
        broker-lectura:
          brokerURL: tcp://middleware-amq-tcp:61616
          userName: usr-read
      client:
        trabajo:
          destinationName: ${amiga.service.jms.trabajo-queue.destination-fqdn}
          receiveTimeout: 100
          pubSubDomain: false
        tarea:
          destinationName: ${amiga.service.jms.tarea-queue.destination-fqdn}
          receiveTimeout: 100
          pubSubDomain: false
