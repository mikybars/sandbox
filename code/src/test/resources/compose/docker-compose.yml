version: "3"

services:
  amq:
    image: inditex-docker.jfrog.io/devenv/amq/redhat:7.12.1-3-r0
    ports:
      - "30010:8161"
      - "30020:61616"
    environment:
      - "AMQ_STORAGE_USAGE_LIMIT=100 mb"
      - "AMQ_JMXTRANX_AGENT=false"
      - "AMQ_NAME=broker"
    volumes:
      - "./amq:/opt/conf/secret"
  kafka:
    image: inditex-docker.jfrog.io/devenv/kafka:7.3.2-r0
    ports:
      - "30810:9092"
    environment:
      - "KAFKA_ADVERTISED_LISTENERS=OUTSIDE://localhost:30810,PLAINTEXT://kafka:29092"
      - "KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181"
    volumes:
      - "./kafka:/tmp/data"
    depends_on:
      zookeeper:
        condition: service_healthy
  schema_registry:
    image: inditex-docker.jfrog.io/devenv/schema-registry:7.3.2-r0
    ports:
      - "31210:8081"
    volumes:
      - "./schema_registry:/tmp/data"
    depends_on:
      kafka:
        condition: service_healthy
  zookeeper:
    image: inditex-docker.jfrog.io/devenv/zookeeper:7.3.2-r0
    ports:
      - "2181:2181"
