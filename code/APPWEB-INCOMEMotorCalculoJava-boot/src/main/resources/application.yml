spring:
  main:
    allow-bean-definition-overriding: false
  application:
    name: ICMCLCWB
  profiles:
    active: standalone
app:
  id: ${spring.application.name}
  version: '@project.version@'
  envars:
    slrhorcoms:
      config:
        max-attempts: 2
      service:
        slrhorcomsService:
          festivos:
            endpoint: /HorarioComercialFestivos/list?
            rows: 100
            maxFilterSize: 50
    meta4:
      ping-query-custom:
        enabled: true
        connect-timeout: 10s
        read-timeout: 10s
        type: 2
amiga:
  common:
    soap:
      client:
        login:
          url: https://des-openshift.axdesocp1.central.inditex.grp/icmclcws-develop/services/Login
        meta4:
          url: https://des-openshift.axdesocp1.central.inditex.grp/icmclcws-develop/services/ICM_WS_CALC_INCOME
    rest:
      client:
        health:
          ping-enabled: true
    cache:
      errorHandler:
        failOnError: false
        logOnError: true
        errorFlushStepDuration: PT10S
      remote:
        enabled: true
        max-retries: 0
