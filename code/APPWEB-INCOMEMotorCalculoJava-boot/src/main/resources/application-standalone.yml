app:
  envars:
    calculo:
      cast: true
      precision: 'DECIMAL(23,8)'
      round: true
      decimal: 2
    proceso:
      cast: true
      precision: 'DECIMAL(23,8)'
      round: false
      decimal: 8
    tarea:
      recolectar:
        days-number: 3
      validar:
        enabled: true
        logging: true
        exception: false
      calcular:
        algoritmo:
          thread-size: 2
          calculo:
            batch-size: 25
            thread-size: 4
      ajustar:
        algoritmo:
          thread-size: 2
          ajuste:
            batch-size: 25
            thread-size: 4
      regularizar:
        thread-size: 4
      prevalidacion:
        thread-size: 4
    repository:
      batch-size:
        default: 100
    limpieza:
      days-number: -7
      days-number-creation: -1
      max: 100
      batch-size:
        default: 100
    mail:
      sender: 'noreply@inditex.com'
      receiver: 'income-java@vectoritcgroup.com'
