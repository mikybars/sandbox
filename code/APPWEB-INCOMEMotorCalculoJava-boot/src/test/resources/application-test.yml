spring:
  activemq:
    broker-url: vm://embedded?broker.persistent=false&broker.useShutdownHook=false&broker.useJmx=false
    in-memory: true
amiga:
  common:
    rest:
      client:
        health:
          ping-enabled: false
    metrics:
      type: influx
  service:
    aaa:
      local:
        enable-local-test: true
    session:
      session-type: EMBEDDED
    web:
      api:
        problem-details:
          enabled: false
  data:
    jms:
      connection-factory:
        broker-escritura:
          brokerURL: vm://embedded
        broker-lectura:
          brokerURL: vm://embedded
app:
  envars:
    meta4:
      config:
        pool:
          size: 1
