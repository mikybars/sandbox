## Define parte de la infraestructura. Para completar la definición de la infraestructura se usan los ficheros platform_<tenant>_<slot>_<supraenvironment>_<environment>_<platform>.yml
## Con este fichero indicas en tu código la plantilla Docker que se usa para construir el contenedor
## y la plantilla Openshift que indica los objetos Openshift necesarios para tu aplicación
# Indica las coordenadas GAV del artefacto Maven que contiene la plantilla para crear la imagen Docker que vamos a usar para ejecutar la aplicación.
dockerfile_template: com.inditex.otec.dockerfile:dockerfile-springboot:1.0.0
# Indica las coordenadas GAV del artefacto Maven que contiene la plantilla para crear los objetos Openshift necesarios para la aplicación.
openshift_template: com.inditex.otec.openshift:openshift-springboot:1.13.0