## Define parte de la infraestructura. Para completar la definicion de la infraestructura se usan los ficheros platform_<tenant>_<slot>_<supraenvironment>_<environment>_<platform>.yml
## Con este fichero indicas en tu codigo la plantilla Docker que se usa para construir el contenedor
## y la plantilla Openshift que indica los objetos Openshift necesarios para tu aplicacion
# Indica las coordenadas GAV del artefacto Maven que contiene la plantilla para crear la imagen Docker que vamos a usar para ejecutar la aplicacion.
dockerfile_template: com.inditex.otec.dockerfile:dockerfile-springboot:1.0.0
# Indica las coordenadas GAV del artefacto Maven que contiene la plantilla para crear los objetos Openshift necesarios para la aplicacion.
openshift_template: com.inditex.otec.openshift:openshift-springboot:1.14.2
environments:
  pre:
    pre:
      - intranetarteixo
    prelt:
      - intranetarteixo
    prepru:
      - intranetarteixo
  pro:
    pro:
      - intranetarteixo