metadata:
  developModel: CORPORATE
  layer: core
  namespace_id: rhcompensa
app:
  context_path_builder:
    enabled: true
  readiness_probe:
    initial_delay_seconds: 120
  liveness_probe:
    initial_delay_seconds: 150
  instrumented:
    readiness_probe:
      initial_delay_seconds: 180
    liveness_probe:
      initial_delay_seconds: 210
  has_spnego: true
  services:
    http:
      route:
        disable_cookies: false
        tls:
          enabled: true
          insecure_termination_policy: Redirect
    http_private:
      enabled: true
  replicas: 1
  scaler:
    optin: true
  openshift_template: com.inditex.sentinel:senttapp-springboot:2.19.0

amq:
  template: com.inditex.sentinel:senttpl-amq:2.7.0
  force: true
  enabled: true
  slot: icmclcwb
  scheduler:
    enabled: true

redis:
  template: com.inditex.sentinel:senttpl-redis:4.0.1
  enabled: true
  shared: true
  slot: icmclcwb
  force: true
  replicas: 1
  ephemeral_cache: true
  node:
    size: S

pipe:
  enabled: true

janus:
  enabled: false
