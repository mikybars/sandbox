---
name: code-maven-deploy-snapshots
run-name: "Args: supraenvs=${{ inputs.SUPRAENVS || 'des' }}, envs=${{ inputs.ENVS || 'all' }}, platforms=${{ inputs.PLATFORMS || 'all' }}, tenants=${{ inputs.TENANTS || 'all' }}, slots=${{ inputs.SLOTS || 'all' }}"

on:
  workflow_dispatch:
    inputs:
      SUPRAENVS:
        description: 'Supra environments to generate manifest files'
        required: true
        default: ''
      ENVS:
        description: 'Environments to generate manifest files'
        required: false
        default: ''
      PLATFORMS:
        description: 'Platforms to generate manifest files'
        required: false
        default: ''
      TENANTS:
        description: 'Tenants to generate manifest files'
        required: false
        default: ''
      SLOTS:
        description: 'Slots to generate manifest files'
        required: false
        default: ''
      LABELS:
        description: 'Labels to set in PR to deployment branch'
        required: true
        default: ''
      STRATEGY:
        description: 'The rollout strategy'
        required: false
        default: ''
      PERCENTAGE:
        description: 'Percentage of the rollout strategy'
        required: false
        default: ''
      ISSUE_NUMBER:
        description: 'ID number (issue or pull request)'
        required: false
        default: ''

  pull_request:
    types: [synchronize, labeled, closed]
    branches: ['develop', 'main', 'develop-*', 'main-*']
    paths: ['code/**', 'paas/**', '.github/workflows/code-*-deploy_snapshots.yml']

env:
  WORKFLOW_VERSION: 2.11.0
  GITHUB_REGISTRY: ghcr.io
  JFROG_REGISTRY: inditex-docker.jfrog.io
  ASDF_IMAGE_NAME: inditex/ci-agents/asdf
  DP_USERNAME: ${{ secrets.DIST_PLAT_DEPLOYER_USERNAME }}
  DP_TOKEN: ${{ secrets.DIST_PLAT_DEPLOYER_TOKEN }}
  NPM_EMAIL: ${{ secrets.DIST_PLAT_DEPLOYER_USERNAME }}
  NPM_AUTH: ${{ secrets.DIST_PLAT_DEPLOYER_NPM_AUTH }}

jobs:
  identify-changes:
    name: Identify Changes
    if: (github.event_name == 'workflow_dispatch')
      || ((github.event.action == 'synchronize' || github.event.action == 'labeled')
        && contains(github.event.pull_request.labels.*.name, 'autodeploy') && github.event.pull_request.state != 'closed')
      || (github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.base.ref, 'develop') && (vars.DEVELOPMENT_FLOW != 'trunk-based-development'))
    runs-on: ubuntu-20.04

    outputs:
      code-changes: ${{ steps.check-code-changes.outputs.changed }}
      config-changes: ${{ steps.check-config-changes.outputs.changed }}

    steps:
      - name: Checkout merge commit
        if: github.event.pull_request.merged == true
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout head branch
        if: (contains(github.event.pull_request.labels.*.name, 'autodeploy') && github.event.pull_request.state != 'closed') || (github.event_name == 'workflow_dispatch')
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check code changes
        uses: inditex/actions/deployment/identify-changes@main
        id: "check-code-changes"
        with:
          tag-suffix: "last-build"
          paths: "code"

      - name: Check config changes
        uses: inditex/actions/deployment/identify-changes@main
        id: "check-config-changes"
        with:
          tag-suffix: "last-build"
          paths: "paas"

  build-and-promote:
    name: Build & Promote
    runs-on: ubuntu-20.04
    needs: [identify-changes]

    steps:
      - name: Checkout merge commit
        if: github.event.pull_request.merged == true
        uses: actions/checkout@v4

      - name: Checkout head branch
        if: (contains(github.event.pull_request.labels.*.name, 'autodeploy') && github.event.pull_request.state != 'closed') || (github.event_name == 'workflow_dispatch')
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Ensure slot is present
        id: slot
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          slots="${{ github.event.inputs.SLOTS }}"
          if [ -z "${slots}" ]; then
            if [ "${{ github.event.pull_request.merged }}" == "true" ]; then
              slots="default"
            else
              slots=$(basename "${REF}")
            fi
          fi
          echo "slots=${slots}" >> "$GITHUB_OUTPUT"

      - name: Validate slots
        id: validate-slots
        uses: inditex/actions/deployment/validate-slots@main
        with:
          slots: ${{ steps.slot.outputs.slots }}
          strategy: ${{ github.event.inputs.STRATEGY }}

      - name: Add comment when the slot is not valid
        if: ${{ github.event.inputs.ISSUE_NUMBER != '' && steps.validate-slots.outputs.error-message != '' }}
        uses: inditex/gha-citool/add-comment@v0
        with:
          issue-number: '${{ github.event.inputs.ISSUE_NUMBER }}'
          body: |
            #### :x: An error has ocurred validating the slots.

            ${{ steps.validate-slots.outputs.error-message }}

            See the [workflow log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.
        env:
          GITHUB_TOKEN: ${{ secrets.CHATBOT_PR_PAT }}

      - name: Stop if slots are not valid
        if: ${{ steps.validate-slots.outputs.is-valid != 'true' }}
        run: |
          echo "::error ::Error validating the slots. ${{ steps.validate-slots.outputs.error-message }}"
          exit 1

      - name: Check if last image exists in the DP via sentcli
        uses: inditex/gha-paasdeployment/check-latest-image@main
        id: check-image
        with:
          token: ${{ secrets.GH_TOKEN_READER }}
          dp_username: ${{ env.DP_USERNAME }}
          dp_token: ${{ env.DP_TOKEN }}

      - name: Store cache
        if: needs.identify-changes.outputs.code-changes == 'true' || steps.check-image.outputs.exists_latest_image == 'false'
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup asdf Cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.asdf/data
          key: ${{ runner.os }}-asdf-${{ hashFiles('**/.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-asdf-

      - name: Log in to GitHub Registry
        if: needs.identify-changes.outputs.code-changes == 'true' || steps.check-image.outputs.exists_latest_image == 'false'
        run: echo "${{ secrets.GH_TOKEN_READER }}" | docker login "${GITHUB_REGISTRY}" -u none --password-stdin

      - name: Log in to JFrog Registry
        if: needs.identify-changes.outputs.code-changes == 'true' || steps.check-image.outputs.exists_latest_image == 'false'
        run: echo "${DP_TOKEN}" | docker login "${JFROG_REGISTRY}" -u "${DP_USERNAME}" --password-stdin

      - name: Store project version
        if: needs.identify-changes.outputs.code-changes == 'true' || steps.check-image.outputs.exists_latest_image == 'false'
        shell: python
        id: version
        run: |
          import xml.etree.ElementTree as ET
          import os

          root = ET.parse('./code/pom.xml').getroot()
          namespace = root.tag.rpartition('}')[0] + '}'
          version = root.find(f'{namespace}version').text
          github_output = os.getenv('GITHUB_OUTPUT')
          with open(github_output, "a") as gh_out:
            gh_out.write(f'app-version={version}\n')

      - name: Infer ci-agents asdf image
        uses: inditex/gha-ivmactions/infer-ci-agent-asdf@v0
        env:
          ASDF_UBUNTU_IMAGE_TAG: 0.12.0-ubuntu20.04-r2
          ASDF_RHUBI_IMAGE_TAG: 0.12.0-rhubi-r3
          ASDF_CENTOS_IMAGE_TAG: 0.12.0-centos-r2
        with:
          tool-versions-directory: code

      - name: Build Artifact
        if: needs.identify-changes.outputs.code-changes == 'true' || steps.check-image.outputs.exists_latest_image == 'false'
        run: |
          mkdir -p "$HOME"/.m2/repository
          mkdir -p "$HOME"/.asdf/data
          docker run --workdir /app/code \
            -u runner \
            -e DP_USERNAME="${DP_USERNAME}" \
            -e DP_TOKEN="${DP_TOKEN}" \
            -e GITHUB_TOKEN=${{ secrets.GH_TOKEN_READER }} \
            -e NPM_EMAIL -e NPM_AUTH \
            -e TOOLVER_DISTRO_BRANCH=${{ vars.TOOLVER_DISTRO_BRANCH }} \
            --mount type=bind,src="$(pwd)",dst=/app \
            --mount type=bind,src="$HOME"/.m2/repository,dst=/home/runner/.m2/repository \
            --mount type=bind,src="$HOME"/.asdf/data,dst=/opt/asdf/data \
            "${GITHUB_REGISTRY}/${ASDF_IMAGE_NAME}:${ASDF_IMAGE_TAG}" \
            mvn -B clean install -DskipTests -Dbuild.type=snapshot

      - name: Generate Maven Reactor List (necessary in Sentinel)
        if: needs.identify-changes.outputs.code-changes == 'true' || steps.check-image.outputs.exists_latest_image == 'false'
        run: |
          docker run --workdir /app/code \
            -u runner \
            -e DP_USERNAME="${DP_USERNAME}" \
            -e DP_TOKEN="${DP_TOKEN}" \
            -e GITHUB_TOKEN=${{ secrets.GH_TOKEN_READER }} \
            -e TOOLVER_DISTRO_BRANCH=${{ vars.TOOLVER_DISTRO_BRANCH }} \
            --mount type=bind,src="$(pwd)",dst=/app \
            --mount type=bind,src="$HOME"/.m2/repository,dst=/home/runner/.m2/repository \
            --mount type=bind,src="$HOME"/.asdf/data,dst=/opt/asdf/data \
            "${GITHUB_REGISTRY}/${ASDF_IMAGE_NAME}:${ASDF_IMAGE_TAG}" \
            mvn -q -Dexec.executable=echo -Dexec.args='${project.groupId},${project.artifactId},${project.version},${project.parent.basedir},${project.basedir},${project.build.directory}/${project.build.finalName}.${project.packaging}' exec:exec | tee code/maven_reactor_list.csv

      - name: Sentinel - Create Dockerfile
        if: needs.identify-changes.outputs.code-changes == 'true' || steps.check-image.outputs.exists_latest_image == 'false'
        id: sentinel
        uses: inditex/actions/sentinel@main
        with:
          app-version: ${{ steps.version.outputs.app-version }}
          working-directory: code
          token: ${{ secrets.GH_TOKEN_READER }}
        env:
          IMAGE_BUILD_TYPE: snapshot
          MERGED: ${{ github.event.pull_request.merged }}

      - name: Build and push artifact
        if: needs.identify-changes.outputs.code-changes == 'true' || steps.check-image.outputs.exists_latest_image == 'false'
        uses: inditex/actions/docker/build-and-push@main
        with:
          registry: ${{ steps.sentinel.outputs.image-registry }}
          token: ${DP_TOKEN}
          image-name: projects/${{ steps.sentinel.outputs.image-name }}
          tags: ${{ steps.sentinel.outputs.image-tags }}
          path: code
          dockerfile: code/Dockerfile

      - name: Dispatch promote workflow with workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: benc-uk/workflow-dispatch@798e70c97009500150087d30d9f11c5444830385
        with:
          workflow: paas-promote
          ref: ${{ github.ref_name }}
          inputs: |
            {
              "SUPRAENVS": "${{ github.event.inputs.SUPRAENVS }}",
              "ENVS": "${{ github.event.inputs.ENVS }}",
              "PLATFORMS": "${{ github.event.inputs.PLATFORMS }}",
              "TENANTS": "${{ github.event.inputs.TENANTS }}",
              "SLOTS": "${{ steps.slot.outputs.slots }}",
              "LABELS": "${{ github.event.inputs.LABELS }}",
              "VERSION": "latest",
              "ISSUE_NUMBER": "${{ github.event.inputs.ISSUE_NUMBER }}",
              "ADDITIONAL_ARGS": "{'STRATEGY': '${{ github.event.inputs.STRATEGY }}','PERCENTAGE': '${{ github.event.inputs.PERCENTAGE }}','CONFIG_REF': ''}"
            }

      - name: Dispatch promote workflow with autodeploy label
        if: contains(github.event.pull_request.labels.*.name, 'autodeploy') && github.event.pull_request.state != 'closed'
        uses: benc-uk/workflow-dispatch@798e70c97009500150087d30d9f11c5444830385
        with:
          workflow: paas-promote
          ref: ${{ github.head_ref }}
          inputs: |
            {
              "SUPRAENVS": "des,pre,pro",
              "SLOTS": "${{ steps.slot.outputs.slots }}",
              "LABELS": "auto-approval",
              "VERSION": "latest",
              "ISSUE_NUMBER": "${{github.event.pull_request.number}}",
              "ADDITIONAL_ARGS": "{'TRIGGER': 'autodeploy'}"
            }

      - name: Dispatch promote workflow after merge
        if: github.event.pull_request.merged == true
        uses: benc-uk/workflow-dispatch@798e70c97009500150087d30d9f11c5444830385
        with:
          workflow: paas-promote
          ref: ${{ github.base_ref }}
          inputs: |
            {
              "SUPRAENVS": "des,pre,pro",
              "SLOTS": "${{ steps.slot.outputs.slots }}",
              "LABELS": "auto-approval",
              "VERSION": "latest",
              "ISSUE_NUMBER": "${{github.event.pull_request.number}}",
              "ADDITIONAL_ARGS": "{'TRIGGER': 'merged_pr'}"
            }

      - name: Create tag from identify-changes
        uses: inditex/actions/deployment/move-build-tag@main
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create a Workflow Status Check to link this execution with a PR
        if: always() && !cancelled() && github.event_name == 'workflow_dispatch'
        uses: inditex/gha-citool/create-status-check@v0
        with:
          app_id: ${{ vars.WFSC_APP_ID }}
          app_private_key: ${{ secrets.WFSC_APP_PKEY }}
          name: "code-deploy-snapshots-${{ github.event.inputs.SUPRAENVS }}"
          summary: |
            This status check represents the conclusion (__${{ job.status }}__) of the last dispatched execution of workflow:
            `${{ github.workflow_ref }}`
            You can find more details in the link below :arrow_down:

  clean-resources:
    name: Clean Resources
    if: github.event.pull_request.state == 'closed'
    runs-on: ubuntu-20.04
    needs: [build-and-promote]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to JFrog Registry
        run: echo "${DP_TOKEN}" | docker login "${JFROG_REGISTRY}" -u "${DP_USERNAME}" --password-stdin

      - name: Clean up last build tag on closed PR
        uses: inditex/actions/deployment/clean-up-build-tag@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: BatchAsCode / Detect
        id: detect
        shell: python
        run: |
          import os
          is_bat = ("${{ github.repository }}".split('/')[1].split('-')[0] == "bat")
          github_output = os.getenv('GITHUB_OUTPUT')
          with open(github_output, "a") as gh_out:
            gh_out.write('force-token-usage=%s\n' % (is_bat))

      - name: Clean Up / Delete Folder Into Deployment Branch
        uses: inditex/actions/deployment/delete-deployment-folder@main
        with:
          token: ${{ secrets.GH_TOKEN_PUSH }}
          force-token-usage: ${{ steps.detect.outputs.force-token-usage }}
        env:
          SCM_COMMITTER_PGP_KEY: ${{ secrets.BUTLER_PGP_KEY }}
