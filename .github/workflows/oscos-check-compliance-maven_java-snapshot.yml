---
name: "oscos-check-compliance-snapshot"
on:
  workflow_run:
    workflows: [code-maven-build-snapshot]
    types:
      - completed

env:
  WORKFLOW_VERSION: 1.20.0

jobs:
  prepare-oscos-context:
    name: Prepare OSCOS context
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEVELOPMENT_FLOW != 'trunk-based-development' }}
    runs-on: ${{ fromJSON(vars.RUNSON_OSCOS_ONPREM || '["oscos-icr__ci-oscos-base-large"]') }}
    outputs:
      runner-label: ${{ steps.pick-runner-label.outputs.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: pick-runner-label
        name: Pick runner label
        shell: python
        env:
          RUNS: ${{ vars.RUNSON_OSCOS_ONPREM || '["oscos-icr__ci-oscos-base-large"]' }}
        run: |
          import os, json
          data = json.loads(os.environ["RUNS"])
          label = data[0] if isinstance(data, list) and data else (data if isinstance(data, str) else "oscos-icr__ci-oscos-base-large")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"label={label}\n")

  call-reusable-workflow:
    name: Call Reusable OSCOS Check Compliance
    needs: prepare-oscos-context
    uses: inditex/ghw-oscodependencies/.github/workflows/oscos-reusable-check-compliance.yml@v0
    with:
      runs-on: ${{ needs.prepare-oscos-context.outputs.runner-label }}
      is-release: false
      artifact-run-id: ${{ github.event.workflow_run.id }}
      sbom-path: sbom-artifact/sbom.json
      artifact-repository: ${{ github.repository }}
    secrets: inherit
