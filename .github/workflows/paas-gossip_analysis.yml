---
name: paas-gossip-analysis
run-name: gossip analysis with runner ${{ inputs.RUNNER || 'RELEASE' }}

on:
  pull_request:
    paths:
      - 'paas/**'
      - '.github/workflows/paas*'
      - 'code/**'
  workflow_dispatch:
    inputs:
      RUNNER:
        description: 'Runner'
        required: true
        type: choice
        options:
          - SNAPSHOT
          - RELEASE
        default: 'SNAPSHOT'

env:
  WORKFLOW_VERSION: 2.2.0
  APP_NAME: gossip-analyzer
  SUPRAENVIRONMENT: pro
  APP_PATH: /opt/inditex/runner-volume/tools/gossip/releases
  TMP_PATH: /tmp/gossip/sre
  CEPH_ACCESS_KEY_ID: cyberark.IE-N-DIG-INFRA-CEPH.Application-ITX-APP-500-SC-Generic-ieec1cs1rdgwlb1.central.inditex.grp-ieec-gossip_accesskey
  CEPH_SECRET_ACCESS_KEY: cyberark.IE-N-DIG-INFRA-CEPH.Application-ITX-APP-500-SC-Generic-ieec1cs1rdgwlb1.central.inditex.grp-ieec-gossip_secretkey
  TOOL_REPORT_URL: https://sscc.central.inditex.grp
  TOOL_REPORT_USERNAME: oauthgossipsrv
  TOOL_REPORT_PASSWORD: cyberark.AX-N-SEG-OAU-IC-OPENAMPR.OAUTH2ClientsPRO_oauthgossipsrv

jobs:
  gossip-analysis:
    name: Gossip / Analysis
    timeout-minutes: 30
    runs-on: [self-hosted, testing-ivm]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup IVM Python
        uses: inditex/gha-ivmactions/setup-tool@v0
        with:
          tool-name: ivm-python
          tool-version: 3.8.11

      - name: "Configure Runner SNAPSHOT"
        if: ${{ github.event.inputs.RUNNER == 'SNAPSHOT' }}
        run: |
          echo "APP_PATH=/opt/inditex/runner-volume/tools/gossip/snapshot" >> "$GITHUB_ENV"

      - name: "Configure Runner RELEASE"
        if: ${{ github.event.inputs.RUNNER == 'RELEASE' }}
        run: |
          echo "APP_PATH=/opt/inditex/runner-volume/tools/gossip/releases" >> "$GITHUB_ENV"

      - name: "Check pro environment"
        shell: python
        run: |
          import yaml
          import os
          with open('paas/deployments.yml') as f:
            deployments = yaml.safe_load(f)
            env_list = deployments['supraenvironments']
            for current in env_list:
              if current['name'] == 'pro':
                env_file = os.getenv('GITHUB_ENV')
                with open(env_file, "a") as githubfile:
                  githubfile.write("HAS_PRO=true")

      - name: "Get metadata"
        id: metadata
        if: ${{ env.HAS_PRO }}
        shell: python
        run: |
          import yaml
          import os
          with open('application.yml') as f:
            application = yaml.safe_load(f)
          env_file = os.getenv('GITHUB_ENV')
          with open(env_file, "a") as githubfile:
             githubfile.write("PROJECT_KEY=" + application["metadata"]["project_key"])

      - name: "Launch Gossip Config Generator"
        if: ${{ env.HAS_PRO }}
        uses: inditex/gha-sreactions/gossip/gossip-config@gossip-v5
        with:
          project-key: ${{ env.PROJECT_KEY }}
          ceph-access-key-id: ${{ env.CEPH_ACCESS_KEY_ID }}
          ceph-secret-access-key: ${{ env.CEPH_SECRET_ACCESS_KEY }}
          tmp-path: ${{ env.TMP_PATH }}

      - name: "Merge Config Files"
        if: ${{ env.HAS_PRO }}
        run: |
          "$APP_PATH/$APP_NAME" merge -p "${GITHUB_WORKSPACE}/paas" -d "$TMP_PATH"/target -s "$SUPRAENVIRONMENT" -c "${GITHUB_WORKSPACE}/code"

      - name: "Download CEPH Rules"
        if: ${{ env.HAS_PRO }}
        run: |
          "$APP_PATH/$APP_NAME" download -i releases/latest.zip -d "$TMP_PATH"/rules

      - name: "Set variables for Release"
        if: ${{ github.base_ref == 'main' }}
        run: |
          echo "BLOCKED=--blocked" >> "$GITHUB_ENV"

      - name: Get Macrodomain from Application Map
        if: ${{ env.HAS_PRO }}
        run: |
          gversapp_info=$(curl -s -u ${{ secrets.SRVCGOSSIPAX_USERNAME }}:${{ secrets.SRVCGOSSIPAX_PASSWORD }} \
          "https://sscc.central.inditex.grp/gversapp/mapaaplicaciones/getApplicationsInfo.json?criteria=%7B%22start%22%3A0,%22limit%22%3A10,%22nombreproyectojira%22%3A%22$PROJECT_KEY%22%7D")
            GOSSIP_MACRO_DOMAIN=$(echo "$gversapp_info" | jq -r ".results[]?.macrosistemaNombre" | head -n1 | awk '{print $1;}')
          echo "Macro Domain: $GOSSIP_MACRO_DOMAIN"
          echo "GOSSIP_MACRO_DOMAIN=${GOSSIP_MACRO_DOMAIN}" >> "$GITHUB_ENV"
        shell: bash

      - name: "Configure Rules Namespace"
        id: rulenamespace
        if: ${{ env.HAS_PRO }}
        shell: python
        run: |
          import os
          macho_domain = os.environ.get('GOSSIP_MACRO_DOMAIN')
          print(macho_domain)
          result = "sre.common"
          if macho_domain is not None:
            macho_domain_lower = str(macho_domain).lower()
            if macho_domain_lower:
              result = "sre.common,sre." + str(macho_domain).lower()
          print(result)
          env_file = os.getenv('GITHUB_ENV')
          with open(env_file, "a") as githubfile:
            githubfile.write("RULE_NAMESPACE=" + result)

      - name: "Gossip analyze"
        if: ${{ env.HAS_PRO }}
        run: |
          "$APP_PATH/$APP_NAME" analyze -r "$TMP_PATH"/rules -t "$TMP_PATH"/target -n "$RULE_NAMESPACE" -d "$TMP_PATH"/data.json -x "$TMP_PATH"/result -l "$TMP_PATH"/appreport.html.tmpl "$BLOCKED"

      - name: "Upload Gossip analysis results"
        if: ${{ always() && !cancelled() && env.HAS_PRO }}
        uses: actions/upload-artifact@v3
        with:
          name: Gossip Analysis
          path: ${{ env.TMP_PATH }}/result
          if-no-files-found: warn

      - name: "Send Report Event"
        if: ${{ always() && !cancelled() && env.HAS_PRO }}
        uses: inditex/gha-sreactions/gossip/gossip-event@gossip-v5
        with:
          tool-report-url: ${{ env.TOOL_REPORT_URL}}
          tool-report-username: ${{ env.TOOL_REPORT_USERNAME }}
          tool-report-password: ${{ env.TOOL_REPORT_PASSWORD}}
          result: ${{ env.TMP_PATH }}/result
          branch: ${{ github.base_ref || github.event.repository.default_branch }}
