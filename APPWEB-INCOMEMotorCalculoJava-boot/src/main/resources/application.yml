spring:
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
  application:
    name: ICMCLCWB
  profiles:
    active: standalone
app:
  id: ${spring.application.name}
  version: '@project.version@'
amiga:
  common:
    cache:
      remote:
        enabled: true
    logging:
      includeFullMDC: true
      file:
        enabled: false
      graylog:
        enabled: false
    async:
      default-executor:
        core-pool-size: 50
        max-pool-size: 400
        keep-alive: 60
  service:
    session:
      session-type: REMOTE
    core:
      mdc-filter:
        enabled: true
    aaa:
      security:
        headers:
          frame-options: DISABLE
      local:
        enable-local-test: true
      classic:
        sso:
          applicationSSO: AppJoinFashionIntegracion
    rest-swagger:
      ui:
        title: '@project.name@'
        description: '@project.description@'