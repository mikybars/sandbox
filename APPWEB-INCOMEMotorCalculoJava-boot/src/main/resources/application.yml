spring:
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
  application:
    name: ICMCLCWB
  profiles:
    active: standalone
app:
  id: ${spring.application.name}
  version: '@project.version@'
amiga:
  monitoring:
    metrics:
      enabled: true
      send: true
  common:
    cache:
      remote:
        enabled: true
    logging:
      includeFullMDC: true
      file:
        enabled: false
      graylog:
        enabled: false
    async:
      default-executor:
        core-pool-size: 20
        # async (6) * amiga.service.jms.trabajo-queue.destination-fqdn.concurrency (20)
        max-pool-size: 150
        keep-alive: 10
  service:
    session:
      session-type: REMOTE
    core:
      mdc-filter:
        enabled: true
    aaa:
      security:
        headers:
          frame-options: DISABLE
      local:
        enable-local-test: true
      classic:
        sso:
          applicationSSO: AppJoinFashionIntegracion
    rest-swagger:
      ui:
        title: '@project.name@'
        description: '@project.description@'