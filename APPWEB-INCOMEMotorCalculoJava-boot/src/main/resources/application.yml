spring:
  application:
    name: ICMCLCWB
  profiles:
    active: standalone
  jta:
    atomikos:
      properties:
        max-timeout: 10m
amiga:
  monitoring:
    metrics:
      enabled: true
  common:
    cache:
      remote:
        cache-names: itx.icmclcwb.tipos_hora
    logging:
      file:
        enabled: false
    reactor:
      scheduler:
        elastic:
          core-pool-size: 10
          maximum-pool-size: 100
    async:
      default-executor:
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
    executor:
      meta4-executor:
        name: async-meta4-executor
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
      ptr-venta-executor:
        name: async-ptr-venta-executor
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
      ptr-presencia-executor:
        name: async-ptr-presencia-executor
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
      repository-primary-executor:
        name: async-repository-primary-executor
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
  service:
    jms:
      listener:
        default:
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
      trabajo-queue:
        destination-fqdn: ${metadata.tenant}.${metadata.domain}.${metadata.openshiftproject}.private.trabajo-queue-${metadata.slot}
      tarea-queue:
        destination-fqdn: ${metadata.tenant}.${metadata.domain}.${metadata.openshiftproject}.private.tarea-queue-${metadata.slot}
    core:
      mdc-filter:
        enabled: true
    aaa:
      classic:
        sso:
          applicationSSO: AppINCOMEMotorCalculoJava
    rest-swagger:
      ui:
        title: '@project.name@'
        description: '@project.description@'
  data:
    jms:
      connection-factory:
        broker-escritura:
          minPoolSize: 1
          maxPoolSize: 10
        broker-lectura:
          minPoolSize: 1
          maxPoolSize: 10
      listener-container-factory:
        trabajo:
          concurrency: 1
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
        tarea:
          concurrency: 2
          sessionTransacted: true
          globalTransacted: true
          pubSubDomain: false
          receiveTimeout: 1000
      client:
        trabajo:
          destinationName: ${amiga.service.jms.trabajo-queue.destination-fqdn}
          pubSubDomain: false
          sessionTransacted: true
        tarea:
          destinationName: ${amiga.service.jms.tarea-queue.destination-fqdn}
          pubSubDomain: false
          sessionTransacted: true
    jdbc:
      configuration:
        prop:
          default-isolation-level: 1
          max-pool-size: 10
          query-timeout: 30s
      datasource:
        primary:
          xa-data-source-class-name: com.ibm.db2.jcc.DB2XADataSource
          xa-properties:
            clientProgramName: ${metadata.jirakey}
            driverType: 4
            loginTimeout: 300
            connectionTimeout: 300
            commandTimeout: 300
            interruptProcessingMode: 2
    hibernate:
      primary:
        properties: '{''hibernate.dialect'':''com.inditex.rrhh.icmclcwb.model.primary.dialect.DB2NativeDialect''}'
app:
  id: ${spring.application.name}
  version: '@project.version@'
  envars:
    calculo:
      cast: true
      precision: DECIMAL(23,8)
    proceso:
      cast: true
      precision: DECIMAL(23,8)
    tarea:
      recolectar:
        days-number: 3
      validar:
        enabled: true
        logging: true
        exception: false
      calcular:
