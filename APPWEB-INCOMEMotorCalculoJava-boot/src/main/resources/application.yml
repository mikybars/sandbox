spring:
  application:
    name: ICMCLCWB
  profiles:
    active: standalone
app:
  id: ${spring.application.name}
  version: '@project.version@'
amiga:
  common:
    cache:
      remote:
        enabled: true
    logging:
      includeFullMDC: true
      file:
        enabled: false
      graylog:
        enabled: false
    async:
      default-executor:
        core-pool-size: 20
        max-pool-size: 150
        keep-alive: 10
  service:
    session:
      session-type: REMOTE
    core:
      mdc-filter:
        enabled: true
    aaa:
      local:
        enable-local-test: true
      classic:
        sso:
          applicationSSO: AppJoinFashionIntegracion
    rest-swagger:
      ui:
        title: '@project.name@'
        description: '@project.description@'