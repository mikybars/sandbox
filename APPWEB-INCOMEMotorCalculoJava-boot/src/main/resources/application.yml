spring:
  application:
    name: ICMCLCWB
  profiles:
    active: standalone
app:
  id: ${spring.application.name}
  version: '@project.version@'
amiga:
  common:
    cache:
      remote:
        enabled: true
        cache-names: itx.icmclcwb.tipos_hora
    logging:
      file:
        enabled: false
    reactor:
      scheduler:
        elastic:
          core-pool-size: 10
          maximum-pool-size: 100
    async:
      default-executor:
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
    executor:
      meta4-executor:
        name: async-meta4-executor
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
      ptr-venta-executor:
        name: async-ptr-venta-executor
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
      ptr-presencia-executor:
        name: async-ptr-presencia-executor
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
      repository-primary-executor:
        name: async-repository-primary-executor
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
  service:
    session:
      session-type: REMOTE
    core:
      mdc-filter:
        enabled: true
    aaa:
      classic:
        sso:
          applicationSSO: AppINCOMEMotorCalculoJava
    rest-swagger:
      ui:
        title: '@project.name@'
        description: '@project.description@'