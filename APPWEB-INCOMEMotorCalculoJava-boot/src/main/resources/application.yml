spring:
  main:
    allow-bean-definition-overriding: false
  application:
    name: ICMCLCWB
  profiles:
    active: standalone
  jta:
    atomikos:
      properties:
        max-timeout: 10m
        default-jta-timeout: 10m
app:
  id: ${spring.application.name}
  version: '@project.version@'
amiga:
  common:
    cache:
      remote:
        enabled: true
        cache-names: itx.icmlcwb.id_localizacion_by_tarea_and_id_origen_in_ambito,itx.icmlcwb.id_localizacion_by_tarea_and_id_origen_and_tipo_dato_in_ambito,itx.icmlcwb.id_localizacion_local_by_tarea_and_id_origen_and_tipo_dato_in_ambito,itx.icmlcwb.id_localizacion_local_by_tarea_and_id_origen_in_ambito,itx.icmlcwb.id_localizacion_local_by_tarea_and_id_origen,itx.icmlcwb.id_cadena_by_tarea_and_id_origen_and_tipo_dato,itx.icmlcwb.id_cadena_by_tarea_and_id_origen,itx.icmlcwb.id_persona_by_tarea_and_id_origen,itx.icmlcwb.id_persona_historico_by_tarea_and_id_origen_and_tipo_dato,itx.icmlcwb.id_producto_by_id_tarea_and_id_origen,itx.icmlcwb.id_tipo_dato_by_id_tipo_grupo_dato,itx.icmlcwb.id_persona_historico_by_tarea_and_id_origen,itx.icmlcwb.periodo_by_tarea,itx.icmlcwb.id_persona_historico_grupo_fechas_by_tarea,itx.icmlcwb.id_localizacion_local_presupuestos_by_tarea,itx.icmlcwb.id_persona_local_challenge_by_tarea,itx.icmlcwb.presupuestos_by_tarea,itx.icmlcwb.list_periodo_presupuestos_by_id_tarea_and_page,itx.icmlcwb.list_periodo_presupuestos_by_id_tarea_and_days,itx.icmlcwb.periodo_presupuestos_by_id_tarea_repository,itx.icmlcwb.tipo_ausencia_by_icm_tp_absence,itx.icmlcwb.tipo_ausencia_by_id,itx.icmlcwb.tipo_opcion_calculo_by_id_meta4,itx.icmlcwb.tipo_politica_by_id_meta4,itx.icmlcwb.tipo_politica_by_id,itx.icmlcwb.tipo_presupuesto_by_icm_id_tp_presupuesto,itx.icmlcwb.tipo_presupuesto_by_id,itx.icmlcwb.tipo_unidad_tiempo_by_icm_id_unidad_tiempo,itx.icmlcwb.tipo_unidad_tiempo_by_id,itx.icmlcwb.tipo_venta_concepto_by_id_meta4,itx.icmlcwb.tipo_venta_concepto_by_id,itx.icmlcwb.tipo_venta_concepto_challenge_by_icm_id_concepto_venta,itx.icmlcwb.tipo_venta_concepto_challenge_by_id
    logging:
      file:
        enabled: false
    reactor:
      scheduler:
        elastic: 
          name-format: async-reactor-executor-%d
          core-pool-size: 10
          maximum-pool-size: 100
          queue-size: 200
    async:
      default-executor:
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
    executor:
      meta4-executor:
        name: async-meta4-executor
        name-format: async-meta4-executor-%d
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
      ptr-venta-executor:
        name: async-ptr-venta-executor
        name-format: async-ptr-venta-executor-%d
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
      ptr-presencia-executor:
        name: async-ptr-presencia-executor
        name-format: async-ptr-presencia-executor-%d
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
      repository-primary-executor:
        name: async-repository-primary-executor
        name-format: async-repository-primary-executor-%d
        core-pool-size: 10
        maximum-pool-size: 100
        queue-size: 200
  service:
    session:
      session-type: REMOTE
    core:
      mdc-filter:
        enabled: true
    aaa:
      classic:
        sso:
          applicationSSO: AppINCOMEMotorCalculoJava
    rest-swagger:
      ui:
        title: '@project.name@'
        description: '@project.description@'
