app:
  envars:
    calculo:
      cast: true
      precision: 'DECIMAL(23,8)'
    proceso:
      cast: true
      precision: 'DECIMAL(23,8)'
    tarea:
      recolectar:
        days-number: 3
      validar:
        enabled: true
        logging: true
        exception: false
      calcular:
        algoritmo:
          thread-size: 2
          calculo:
            batch-size: 25
            thread-size: 4
      ajustar:
        algoritmo:
          thread-size: 2
          ajuste:
            batch-size: 25
            thread-size: 4
      regularizar:
        thread-size: 4
      prevalidacion:
        thread-size: 4
    repository:
